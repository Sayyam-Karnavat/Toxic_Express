[project]
name = "toxic-express-api"
version = "0.1.0"
description = "Toxic-Express API: a social network for venting, relating and solving problems"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "redis>=5.2",
    "arq>=0.26",
    "aioboto3>=13.2",
    "pillow>=11.0",
    "pillow-heif>=0.20",
    "imageio-ffmpeg>=0.5",
    "httpx>=0.28",
    "httpcore>=1.0",
    "pyjwt[crypto]>=2.10",
    "pwdlib[argon2]>=0.2",
    "nh3>=0.2",
    "tenacity>=9.0",
    "sentry-sdk[fastapi]>=2.19",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "coverage>=7.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF", "N"]
ignore = ["S101", "B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311", "S603", "S104", "ASYNC221", "E501", "RUF059"]
"migrations/*" = ["E501", "W291"]
"mailer.py" = ["E501"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
exclude = ["migrations", ".venv", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
concurrency = ["greenlet", "thread"]
omit = ["tests/*", "migrations/*"]
