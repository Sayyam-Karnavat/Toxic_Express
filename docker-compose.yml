# Local development infrastructure (Postgres, Redis, S3-compatible storage).
# The API and worker run on the host during development; see docker-compose.prod.yml for deployment.
name: toxic-express-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: toxic
      POSTGRES_PASSWORD: toxic
      POSTGRES_DB: toxic_express
    ports: ["127.0.0.1:5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toxic -d toxic_express"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6380:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  # S3-compatible stand-in for Cloudflare R2.
  s3:
    image: chrislusf/seaweedfs:latest
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-master.volumeSizeLimitMB=256"]
    ports: ["127.0.0.1:8333:8333"]
    volumes:
      - s3data:/data
      - ./infra/s3-dev.json:/etc/seaweedfs/s3.json:ro

volumes:
  pgdata:
  redisdata:
  s3data:
